# CodeConClave Pro — local development infrastructure.
# Provides PostgreSQL (pgvector), Redis, and MinIO (S3-compatible) for local development.
# No Kubernetes required. Production deploys use managed equivalents.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codeconclave-postgres
    environment:
      POSTGRES_USER: codeconclave
      POSTGRES_PASSWORD: codeconclave_dev_password
      POSTGRES_DB: codeconclave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeconclave -d codeconclave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codeconclave-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: codeconclave-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codeconclave_dev
      MINIO_ROOT_PASSWORD: codeconclave_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: codeconclave-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: codeconclave-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
