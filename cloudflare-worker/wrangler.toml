name = "codeconclave-razorpay-webhook-adapter"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (set via `wrangler secret put` or in dashboard)
# vars = { CODECONCLAVE_BACKEND_URL = "https://your-backend.onrender.com" }

# Secrets (set via `wrangler secret put`):
# - RAZORPAY_WEBHOOK_SECRET
# - RAZORPAY_WEBHOOK_SECRET_LEGACY (optional, for signed replays)
# - CODECONCLAVE_BACKEND_URL
# - INTERNAL_WEBHOOK_TOKEN (MUST match the backend's INTERNAL_WEBHOOK_TOKEN;
#   the backend rejects the forwarded webhook without this Bearer token)

# Uncomment for production deployment:
# [env.production]
# vars = { CODECONCLAVE_BACKEND_URL = "https://your-production-backend.onrender.com" }